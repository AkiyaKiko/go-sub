name: Release (Tag)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: gosub

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned sing-box configuration validator
        run: bash .github/scripts/install_singbox_check.sh

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test release archive validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          bin_name="${APP_NAME}_${GOOS}_${GOARCH}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${bin_name}" .

      - name: Package and verify release artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          bin_name="${APP_NAME}_${GOOS}_${GOARCH}${ext}"
          archive_base="${APP_NAME}_${GOOS}_${GOARCH}"

          mkdir -p package release
          cp "dist/${bin_name}" package/
          cp config.example.json package/
          cp lib/preset/singbox.tun.json package/singbox.template.example.json
          cp README.md package/

          if [ "${GOOS}" = "windows" ]; then
            archive_path="release/${archive_base}.zip"
          else
            archive_path="release/${archive_base}.tar.gz"
          fi

          python3 .github/scripts/release_archive.py "${archive_path}" "${bin_name}" --package-dir package

      - name: Verify root tar extraction in an isolated temporary directory
        if: matrix.goos != 'windows'
        run: >-
          sudo python3 .github/scripts/release_archive.py
          "release/${{ env.APP_NAME }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          "${{ env.APP_NAME }}_${{ matrix.goos }}_${{ matrix.goarch }}"

      - name: Upload packaged binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish Official Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packaged artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
